[tool.poetry]
name = "cloud_native_extraction"
version = "0.1.0"
description = "Service for communicating between Deps and Cloud Native Extraction services"
authors = []

[tool.poetry.dependencies]
python = "~3.11"
dependency-injector = ">=4.41.0,<5.0.0"
click = "^8.1.3"
psycopg2-binary = "^2.9.5"
uvicorn = "^0.18.3"
fastapi = "^0.120"
SQLAlchemy = "^2"
httpx = "^0.27.2"
azure-identity = "^1.20.0"
azure-keyvault-secrets = "^4.9.0"
azure-ai-documentintelligence = "^1"
azure-core = "^1.38.0"
urllib3 = "^2.6.0"
pydantic-settings = "^2.0"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
deps-extracted-data = { path = "../vendors/deps-extracted-data", develop = true }

[tool.poetry.group.dev.dependencies]
mypy = "^1.10"
types-python-dateutil = "^2.9.0.20241206"
bandit = "^1.7.5"
flake8 = "^7.1.1"
wemake-python-styleguide = "^0.19.2"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
types-requests = "^2.28"
wdb = "^3.3.0"
requests-mock = "~1.9.3"
setuptools = "<82.0.0"

ipdb = "^0.13.9"
see = "^1.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py39']
exclude = '''
(
    .venv
    | vendors
)
'''
