[tool:pytest]
rootdir = .
cache_dir = /tmp/test_cache/.pytest_cache

filterwarnings =
    ignore::UserWarning
    ignore::FutureWarning
    ignore::DeprecationWarning

[flake8]
ignore =
    F405,
    # used; unable to detect undefined names
    D100,
    # Missing docstring in public module
    D101,
    # Missing docstring in public class
    D103,
    # Missing docstring in public function
    D104,
    # Missing docstring in public package
    B008,
    # Do not perform function calls in argument defaults.  The call is performed only once at function definition time.
    WPS306,
    # Class without a base class
    WPS348,
    # Found a line that starts with a dot
    WPS111,
    # Found too short name
    D107,
    # Missing docstring in __init__
    D102,
    # Missing docstring in public method
    DAR101,
    # Missing parameter(s) in Docstring
    DAR201,
    # Missing "Returns" in Docstring
    F401,
    # Imported but not used
    E800,
    # Found commented out code
    WPS305,
    # Found `f` string
    W503,
    # Line break before binary operator
    WPS115,
    # Found upper-case constant in a class
    WPS600,
    # Found subclassing a builtin
    Q000,
    # Double quotes found but single quotes preferred
    WPS201,
    # Found module with too many imports
    WPS211,
    # Found too many arguments
    WPS300,
    # Found local folder import
    WPS404,
    # Found complex default value
    WPS229,
    # Found too long ``try`` body length
    WPS412,
    # Found `__init__.py` module with logic
    WPS420,
    # Found wrong keyword: pass
    WPS431,
    # Found nested class:
    WPS110,
    # Found wrong variable name
    D106,
    # Missing docstring in public nested class
    WPS226,
    # Found string constant over-use
    WPS237,
    # Found a too complex `f` string
    WPS221,
    # Found line with high Jones Complexity: 16 > 14
    WPS421,
    # Found wrong function call
    D,
    # Remove all docstring rules
    WPS601,
    # Found shadowed class attribute
    WPS602,
    # Found using `@staticmethod`
    WPS604,
    # Found incorrect node inside `class` body
    WPS410,
    # Found wrong metadata variable: __all__
    WPS609,
    # Found direct magic attribute usage: __all__
    F403,
    # used; unable to detect undefined names
    WPS347,
    # Found vague import that may cause confusion: *
    WPS440,
    # Found block variables overlap: *
    WPS453,
    # Found executable mismatch: file is executable but no shebang is present
    WPS323,
    # Found `%` string formatting
    WPS33,
    # Found walrus operator
    WPS473,
    N818,
    WPS222,
    # Found a condition with too much logic
    # Often used in logging
    WPS326,
    # Protected modules allow better encapsulation
    WPS436

allowed-domain-names =
    value,  # We allow using 'value' name when creating dictionaries
    file,   # We are working with files
    data,   # We use name 'data' in our models
    info,   # We use it in settings
    values, # We use it in pydantic validators

exclude =
    .git,
    __pycache__,
    vendors,
    .venv,
    tests,

per-file-ignores =
# There are multiple `assert`s in tests, we allow them:
    src/tests/*.py: S101
    ./deps_cloud_native_extraction/entrypoint.py: WPS421, WPS433, WPS430, WPS212
    ./deps_cloud_native_extraction/containers.py: WPS202, WPS203
    ./deps_cloud_native_extraction/api/fastapi_auth.py: WPS430, WPS433
    ./deps_cloud_native_extraction/extras/datasource/backoff.py: WPS232, WPS231, WPS430, WPS220
    ./deps_cloud_native_extraction/api/auth.py: WPS324
    ./deps_cloud_native_extraction/extras/*: B001, B024, B027
    ./deps_cloud_native_extraction/infrastructure/services/azure_extraction/converters/types/_abstract_table_converter.py: WPS231, WPS219
    ./deps_cloud_native_extraction/infrastructure/services/azure_extraction/azure_field_schema_parser.py: WPS204


max-local-variables = 15
max-methods = 25
max-line-length = 130
max-module-members = 15
max-module-expressions = 15
max-line-complexity = 16
max-attributes = 15

# to disable false positive N805
classmethod-decorators =
    classmethod
    validator
    root_validator

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
warn_no_return = False
disable_error_code = attr-defined, name-defined

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv

[coverage:run]
omit =
    tests/*
    */__init__.py
    /app/.venv/*
    /vendors/*
branch = True
data_file = /tmp/test_cache/.coverage

[ipdb]
context = 21
