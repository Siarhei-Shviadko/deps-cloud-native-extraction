version: "3.4"

services:
  api:
    build:
      context: .
      dockerfile: ./etc/cloud-native-extraction/Dockerfile
      target: develop
      args:
        REPOSITORY_URL: "${REPOSITORY_URL}"
      cache_from:
        - "cloud-native-extraction-dev:latest"
    env_file:
      - ./etc/cloud-native-extraction/env/.dev.env
      - .env
    networks:
      - deps-network
    volumes:
      - ./src/deps_cloud_native_extraction:/app/deps_cloud_native_extraction
      - ./src/tests:/app/tests
      - ./src/poetry.lock:/app/poetry.lock
      - ./src/pyproject.toml:/app/pyproject.toml
      - ./vendors:/vendors
      - ./src/setup.cfg:/app/setup.cfg
    ports:
      - "8890:8000"
    stdin_open: true
    tty: true

  consumer:
    build:
      context: .
      dockerfile: ./etc/cloud-native-extraction/Dockerfile
      target: develop
      args:
        REPOSITORY_URL: "${REPOSITORY_URL}"
      cache_from:
        - "cloud-native-extraction-dev:latest"
    env_file:
      - ./etc/cloud-native-extraction/env/.dev.env
      - .env
    networks:
      - deps-network
    volumes:
      - ./src/deps_cloud_native_extraction:/app/deps_cloud_native_extraction
      - ./src/poetry.lock:/app/poetry.lock
      - ./src/pyproject.toml:/app/pyproject.toml
      - ./vendors:/vendors
    stdin_open: true
    tty: true

  migrator:
    build:
      context: .
      dockerfile: ./etc/migrator/Dockerfile
      args:
        REPOSITORY_URL: "${REPOSITORY_URL}"
      cache_from:
        - "cloud-native-extraction-migrator:latest"
    env_file: ./etc/migrator/env/.dev.env
    networks:
      - deps-network
    volumes:
      - ./etc/migrator/migrations:/app/migrations

networks:
  deps-network:
    external: True
