apiVersion: v1
kind: Service
metadata:
  name: cloud-native-extraction
  labels:
    {{- include "deps-cloud-native-extraction.labels" . | nindent 4 }}
spec:
  type: {{ .Values.cloud_native_extraction.service.type }}
  ports:
    - port: {{ .Values.cloud_native_extraction.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "deps-cloud-native-extraction.selectorLabels" . | nindent 4 }}
