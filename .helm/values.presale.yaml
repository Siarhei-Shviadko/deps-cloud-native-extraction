cloud_native_extraction:
  image:
    path: "/deps-presale-x01/deps-cloud-native-extraction"

cloud_native_extraction_settings:
  ENV: presale
  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false

migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

cloud_native_extraction_consumer:
  image:
    path: "/deps-presale-x01/deps-cloud-native-extraction"

migrator:
  image:
    path: "/deps-presale-x01/deps-cloud-native-extraction-migrator"

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-presale'
  roleName: 'k8s-presale'
  vaultKubernetesMountPath: 'kubernetes-presale'

service_account:
  serviceAccountName: 'deps-presale'
